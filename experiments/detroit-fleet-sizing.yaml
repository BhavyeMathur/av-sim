sim:
  region: "detroit"

  length_s: 604800
  requests_file:
    template: data/requests/{sim.region}.parquet
  riders_file:
    template: "data/riders/{sim.region}-{fleet.fleet_size}.parquet"
  h3_resolution: 7

policy:
  matching: bounded-h3
  charging: in-place

fleet:
  fleet_size:
    values: [ 40000, 45000, 50000, 55000, 60000, 65000, 70000, 75000 ]
  frac_2_seater: 0.0
  frac_4_seater: 0.0
