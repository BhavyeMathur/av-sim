sim:
  length_s: 604800
  requests_file: data/requests/ann-arbor.parquet
  riders_file:
    template: "data/riders/ann-arbor-{fleet.fleet_size}.parquet"
  h3_resolution: 7

policy:
  matching: bounded-h3

  charging: hubs
  n_hubs: 2
  charging_hubs:
    template: "data/charging-hubs/ann-arbor-{policy.n_hubs}.csv"

fleet:
  fleet_size: 60000
  frac_2_seater: 0.0
  frac_4_seater: 0.0
