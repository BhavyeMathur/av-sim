sim:
  region: "ann-arbor"

  length_s: 604800
  requests_file:
    template: data/requests/{sim.region}.parquet
  riders_file:
    template: "data/riders/{sim.region}-{fleet.fleet_size}.parquet"
  h3_resolution: 7

policy:
  matching: bounded-h3
  max_response_time_s: 900  # 15 minutes

  charging: hubs
  n_hubs: 2
  charging_hubs:
    template: "data/charging-hubs/ann-arbor-{policy.n_hubs}.csv"

fleet:
  fleet_size:
    values: [ 5000, 7500, 9000, 10000, 10500, 11000, 11500, 12000, 12500, 13000, 13500, 14000, 14500, 15000, 17500, 20000, 25000, 30000 ]
  frac_2_seater: 0.0
  frac_4_seater: 0.0
