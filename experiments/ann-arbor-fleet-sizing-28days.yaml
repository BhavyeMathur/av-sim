sim:
  region: "ann-arbor"

  length_s: 2419200
  requests_file:
    template: data/requests/{sim.region}-28days.parquet
  riders_file:
    template: "data/riders/{sim.region}-{fleet.fleet_size}.parquet"
  h3_resolution: 7

policy:
  matching: bounded-h3
  max_response_time_s: 900  # 15 minutes

  charging: hubs
  n_hubs: 2
  charging_hubs:
    template: "data/charging-hubs/ann-arbor-{policy.n_hubs}.csv"

fleet:
  fleet_size:
    values: [ 3000, 3500, 4000, 4500, 5000, 5500, 6000, 6500, 7000, 7500, 8000, 8500, 9000, 9500, 10000]
  frac_2_seater: 0.5
  frac_4_seater: 0.4
